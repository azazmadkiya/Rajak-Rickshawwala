name: Build and Release Debug APK and AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "Checking Java version..."
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"
          
          JAVA_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VERSION" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          
          if [[ "$JAVA_VERSION" == 1.* ]]; then
            JAVA_MAJOR_VERSION=$(echo "$JAVA_VERSION" | cut -d'.' -f2)
          else
            JAVA_MAJOR_VERSION=$(echo "$JAVA_VERSION" | cut -d'.' -f1)
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR_VERSION"
          if [ "$JAVA_MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Active Java major version must be 17 or newer, found $JAVA_MAJOR_VERSION."
            exit 1
          fi
          echo "Java version verification passed."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          KEYSTORE_PATH="./debug.keystore"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_PATH" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            
            if [ -f "$KEYSTORE_PATH" ]; then
              echo "debug.keystore generated successfully."
            else
              echo "Error: Failed to generate debug.keystore."
              exit 1
            fi
          fi

      - name: Copy google-services.json to app module
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json app/google-services.json
            echo "Copied google-services.json to app/google-services.json"
          else
            echo "Warning: google-services.json not found in root."
          fi

      - name: Build debug APK and AAB
        run: |
          gradle :app:assembleDebug :app:bundleDebug --stacktrace --no-daemon

      - name: Verify APK and AAB outputs
        id: verify_outputs
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          AAB_PATH="app/build/outputs/bundle/debug/app-debug.aab"
          
          if [ -f "$APK_PATH" ]; then
            echo "Expected debug APK found at $APK_PATH"
          else
            echo "Error: Expected debug APK not found at $APK_PATH"
            find app/build/outputs -name "*.apk" || true
            exit 1
          fi

          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file is empty."
            exit 1
          fi

          if [ -f "$AAB_PATH" ]; then
            echo "Expected debug AAB found at $AAB_PATH"
          else
            echo "Error: Expected debug AAB not found at $AAB_PATH"
            find app/build/outputs -name "*.aab" || true
            exit 1
          fi

          if [ ! -s "$AAB_PATH" ]; then
            echo "Error: AAB file is empty."
            exit 1
          fi

          echo "APK and AAB verification passed successfully."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload debug AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-aab
          path: app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error

      - name: Prepare release assets
        id: prepare_assets
        run: |
          mkdir -p release_assets_dir
          
          REPO_NAME=$(echo "${{ github.repository }}" | sed 's#.*/##' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/_/g')
          
          APK_ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}-${{ github.run_attempt }}.apk"
          APK_ASSET_PATH="release_assets_dir/${APK_ASSET_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK_ASSET_PATH"
          
          AAB_ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}-${{ github.run_attempt }}.aab"
          AAB_ASSET_PATH="release_assets_dir/${AAB_ASSET_NAME}"
          cp app/build/outputs/bundle/debug/app-debug.aab "$AAB_ASSET_PATH"
          
          if [ ! -s "$APK_ASSET_PATH" ]; then
            echo "Error: Copied APK asset is empty or missing."
            exit 1
          fi
          
          if [ ! -s "$AAB_ASSET_PATH" ]; then
            echo "Error: Copied AAB asset is empty or missing."
            exit 1
          fi
          
          echo "apk_asset_path=$APK_ASSET_PATH" >> $GITHUB_OUTPUT
          echo "apk_asset_name=$APK_ASSET_NAME" >> $GITHUB_OUTPUT
          echo "aab_asset_path=$AAB_ASSET_PATH" >> $GITHUB_OUTPUT
          echo "aab_asset_name=$AAB_ASSET_NAME" >> $GITHUB_OUTPUT
          echo "Prepared release assets: $APK_ASSET_PATH and $AAB_ASSET_PATH"

      - name: Publish APK and AAB to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking GitHub CLI availability..."
          gh --version
          
          APK_PATH="${{ steps.prepare_assets.outputs.apk_asset_path }}"
          APK_NAME="${{ steps.prepare_assets.outputs.apk_asset_name }}"
          AAB_PATH="${{ steps.prepare_assets.outputs.aab_asset_path }}"
          AAB_NAME="${{ steps.prepare_assets.outputs.aab_asset_name }}"
          
          if [ ! -f "$APK_PATH" ] || [ ! -f "$AAB_PATH" ]; then
            echo "Error: Release assets missing."
            exit 1
          fi
          
          TAG_NAME="debug-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug Build #${{ github.run_number }} (Attempt ${{ github.run_attempt }})"
          
          echo "Cleaning up any existing release/tag with name $TAG_NAME..."
          gh release delete "$TAG_NAME" --yes --cleanup-tag || true
          git push origin --delete "$TAG_NAME" || true
          
          RELEASE_NOTES=$(cat <<EOF
          ### Automated Android Build
          - **GitHub Actions Run:** #${{ github.run_number }} (Attempt: ${{ github.run_attempt }})
          - **Source Commit:** ${{ github.sha }}
          - **Files Included:**
            - **APK:** \`$APK_NAME\` (for direct installation on device)
            - **AAB:** \`$AAB_NAME\` (Android App Bundle)
          - **Note:** Built with debug keystore for testing and distribution.
          EOF
          )
          
          echo "Creating GitHub Release $TAG_NAME with APK and AAB..."
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "$RELEASE_NOTES" \
            "$APK_PATH#$APK_NAME" \
            "$AAB_PATH#$AAB_NAME"
          
          echo "Release created successfully."

      - name: Report download results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-build-${{ github.run_number }}-${{ github.run_attempt }}"
          APK_NAME="${{ steps.prepare_assets.outputs.apk_asset_name }}"
          AAB_NAME="${{ steps.prepare_assets.outputs.aab_asset_name }}"
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          
          if [ "$RELEASE_OUTCOME" == "success" ]; then
            echo "Publishing succeeded."
            gh release view "$TAG_NAME" --json url,tagName,name || true
            
            REPO_URL="https://github.com/${{ github.repository }}"
            RELEASE_URL="$REPO_URL/releases/tag/$TAG_NAME"
            
            echo "### GitHub Release Succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** $TAG_NAME" >> $GITHUB_STEP_SUMMARY
            echo "- **Release URL:** $RELEASE_URL" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Asset:** $APK_NAME (Direct install on Android)" >> $GITHUB_STEP_SUMMARY
            echo "- **AAB Asset:** $AAB_NAME (Android App Bundle)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "You can download both the APK and AAB directly from the release Assets section." >> $GITHUB_STEP_SUMMARY
            echo "Both files are also saved as GitHub Actions artifacts (**app-debug-apk** and **app-debug-aab**)." >> $GITHUB_STEP_SUMMARY
          else
            echo "Warning: GitHub Release publishing failed or was skipped."
            echo "Please ensure repository settings -> Actions -> General -> Workflow permissions is set to 'Read and write permissions'."
            
            echo "### GitHub Release Notice" >> $GITHUB_STEP_SUMMARY
            echo "- **Warning:** Automatic release publishing encountered an issue (usually caused by Read-Only repository workflow permissions)." >> $GITHUB_STEP_SUMMARY
            echo "- **How to Fix:** Go to repository **Settings** -> **Actions** -> **General** -> **Workflow permissions** and select **Read and write permissions**." >> $GITHUB_STEP_SUMMARY
            echo "- **Build Status:** Both APK and AAB built successfully." >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifacts:** Both **app-debug-apk** and **app-debug-aab** artifacts remain available for download in the workflow run summary." >> $GITHUB_STEP_SUMMARY
          fi
